services:
  - type: web
    name: linkplease-webhook
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PSEUDOGRAM_API_KEY
        sync: false
      - key: DB_PATH
        value: /var/data/linkplease.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
