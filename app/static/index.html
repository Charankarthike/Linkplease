<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkPlease - Webhook Automation Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-in;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideUp 0.5s ease-out;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-card.sent .value { color: #10b981; }
        .stat-card.failed .value { color: #ef4444; }
        .stat-card.queued .value { color: #f59e0b; }
        .stat-card.blocked .value { color: #8b5cf6; }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: fadeIn 0.8s ease-in;
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .rules-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .rule-item {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            transition: background 0.2s ease;
        }

        .rule-item:hover {
            background: #f3f4f6;
        }

        .rule-keyword {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .rule-message {
            color: #666;
            font-size: 0.9rem;
        }

        .rule-id {
            font-size: 0.75rem;
            color: #999;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            display: none;
        }

        .notification.success {
            background: #10b981;
        }

        .notification.error {
            background: #ef4444;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .refresh-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .refresh-btn:hover {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 LinkPlease</h1>
            <p>Automated DM Webhook System</p>
        </div>

        <div class="dashboard">
            <div class="stat-card sent">
                <h3>✓ Messages Sent</h3>
                <div class="value" id="stat-sent">0</div>
            </div>
            <div class="stat-card failed">
                <h3>✗ Failed</h3>
                <div class="value" id="stat-failed">0</div>
            </div>
            <div class="stat-card queued">
                <h3>⏳ Queued</h3>
                <div class="value" id="stat-queued">0</div>
            </div>
            <div class="stat-card blocked">
                <h3>🛡️ Duplicates Blocked</h3>
                <div class="value" id="stat-blocked">0</div>
            </div>
        </div>

        <div class="main-content">
            <div class="card">
                <h2>➕ Create New Rule</h2>
                <form id="rule-form">
                    <div class="form-group">
                        <label for="keyword">Keyword</label>
                        <input type="text" id="keyword" placeholder="e.g., PRICE, LINK, INFO" required>
                    </div>
                    <div class="form-group">
                        <label for="dm-message">DM Message</label>
                        <textarea id="dm-message" placeholder="Enter the automatic reply message..." required></textarea>
                    </div>
                    <button type="submit" class="btn">Create Rule</button>
                </form>
            </div>

            <div class="card">
                <h2>📋 Active Rules</h2>
                <button class="refresh-btn" onclick="loadRules()">🔄 Refresh</button>
                <div class="rules-list" id="rules-list">
                    <div class="empty-state">Loading rules...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // Load stats on page load
        async function loadStats() {
            try {
                const response = await fetch('/stats');
                const data = await response.json();
                
                document.getElementById('stat-sent').textContent = data.sent || 0;
                document.getElementById('stat-failed').textContent = data.failed || 0;
                document.getElementById('stat-queued').textContent = data.queued || 0;
                document.getElementById('stat-blocked').textContent = data.duplicates_blocked || 0;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load rules
        async function loadRules() {
            try {
                const response = await fetch('/rules');
                const rules = await response.json();
                
                const rulesList = document.getElementById('rules-list');
                
                if (rules.length === 0) {
                    rulesList.innerHTML = '<div class="empty-state">No rules created yet. Create your first rule!</div>';
                } else {
                    rulesList.innerHTML = rules.map(rule => `
                        <div class="rule-item">
                            <div class="rule-keyword">🔑 ${rule.keyword}</div>
                            <div class="rule-message">${rule.dm_message}</div>
                            <div class="rule-id">ID: ${rule.rule_id}</div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading rules:', error);
                document.getElementById('rules-list').innerHTML = '<div class="empty-state">Error loading rules</div>';
            }
        }

        // Show notification
        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        // Handle form submission
        document.getElementById('rule-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const keyword = document.getElementById('keyword').value;
            const dmMessage = document.getElementById('dm-message').value;
            
            try {
                const response = await fetch('/rules', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        keyword: keyword,
                        dm_message: dmMessage
                    })
                });
                
                if (response.ok) {
                    showNotification('✓ Rule created successfully!', 'success');
                    document.getElementById('rule-form').reset();
                    loadRules();
                    loadStats();
                } else {
                    const error = await response.json();
                    showNotification('✗ Error: ' + (error.detail || 'Failed to create rule'), 'error');
                }
            } catch (error) {
                showNotification('✗ Network error: ' + error.message, 'error');
            }
        });

        // Auto-refresh stats every 5 seconds
        setInterval(loadStats, 5000);

        // Initial load
        loadStats();
        loadRules();
    </script>
</body>
</html>
